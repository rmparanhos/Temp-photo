[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ella"
version = "0.1.0"
description = "Photo assistant — finds similar photos and keeps the best quality one"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "Pillow>=10.0",
    "imagehash>=4.3",
    "numpy>=1.24",
    "textual>=0.60",
]

[project.scripts]
ella = "ella.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ella"]
